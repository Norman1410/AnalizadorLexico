<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualizador de Árbol</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --node-fill: #1e293b;
            --node-stroke: #38bdf8;
            --link-stroke: #334155;
            --accent-color: #38bdf8;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 1rem 2rem;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 600;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .controls {
            display: flex;
            gap: 1rem;
        }

        button {
            background: #334155;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.875rem;
        }

        button:hover {
            background: #475569;
            border-color: var(--accent-color);
        }

        #canvas-container {
            flex-grow: 1;
            position: relative;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        .node circle {
            fill: var(--node-fill);
            stroke: var(--node-stroke);
            stroke-width: 2px;
            transition: all 0.3s;
        }

        .node text {
            font-size: 12px;
            fill: var(--text-color);
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }

        .link {
            fill: none;
            stroke: var(--link-stroke);
            stroke-width: 1.5px;
            transition: all 0.3s;
        }

        .tooltip {
            position: absolute;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--accent-color);
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.8rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            z-index: 20;
            max-width: 300px;
        }

        .node:hover circle {
            stroke-width: 4px;
            filter: drop-shadow(0 0 8px var(--accent-color));
        }

        #empty-state {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            display: none;
        }
    </style>
</head>

<body>
    <header>
        <h1>Analizador Léxico y Sintáctico - AST</h1>
        <div class="controls">
            <button onclick="zoomIn()">Zoom +</button>
            <button onclick="zoomOut()">Zoom -</button>
            <button onclick="resetZoom()">Reset</button>
            <button onclick="reloadData()">Recargar Datos</button>
        </div>
    </header>

    <div id="canvas-container">
        <div id="empty-state">
            <h2>No se encontró 'ast_output.json'</h2>
            <p>Asegúrate de ejecutar el compilador primero para generar los datos.</p>
        </div>
        <div class="tooltip" id="tooltip"></div>
    </div>

    <script>
        const margin = { top: 40, right: 90, bottom: 50, left: 90 };
        const width = window.innerWidth;
        const height = window.innerHeight - 80;

        let svg, g, tree, root;
        let zoom = d3.zoom().on("zoom", (event) => {
            g.attr("transform", event.transform);
        });

        function init() {
            svg = d3.select("#canvas-container").append("svg")
                .call(zoom)
                .append("g");

            g = svg.append("g")
                .attr("transform", `translate(${width / 2}, ${margin.top})`);

            tree = d3.tree().nodeSize([120, 180]);

            loadData();
        }

        async function loadData() {
            try {
                const response = await fetch('ast_output.json');
                if (!response.ok) throw new Error();
                const data = await response.json();
                document.getElementById('empty-state').style.display = 'none';
                update(data);
            } catch (err) {
                document.getElementById('empty-state').style.display = 'block';
                console.error("Error cargando AST:", err);
            }
        }

        function update(source) {
            // Limpiar previo
            g.selectAll("*").remove();

            root = d3.hierarchy(source, d => {
                // Adaptar estructura de mis nodos a lo que espera D3
                const children = [];
                for (const key in d) {
                    const val = d[key];
                    if (val && typeof val === 'object') {
                        if (Array.isArray(val)) {
                            val.forEach(item => {
                                if (item && typeof item === 'object') children.push(item);
                            });
                        } else if (val.type) {
                            children.push(val);
                        }
                    }
                }
                return children.length > 0 ? children : null;
            });

            tree(root);

            // Enlaces
            g.selectAll(".link")
                .data(root.links())
                .enter().append("path")
                .attr("class", "link")
                .attr("d", d3.linkVertical()
                    .x(d => d.x)
                    .y(d => d.y));

            // Nodos
            const node = g.selectAll(".node")
                .data(root.descendants())
                .enter().append("g")
                .attr("class", "node")
                .attr("transform", d => `translate(${d.x},${d.y})`)
                .on("mouseover", showTooltip)
                .on("mouseout", hideTooltip);

            node.append("circle")
                .attr("r", 10);

            node.append("text")
                .attr("dy", ".35em")
                .attr("y", d => d.children ? -20 : 20)
                .attr("text-anchor", "middle")
                .text(d => d.data.type + (d.data.name ? `: ${d.data.name}` : (d.data.value !== undefined ? `: ${d.data.value}` : "")));
        }

        function showTooltip(event, d) {
            const tooltip = d3.select("#tooltip");
            let content = `<strong>Tipo:</strong> ${d.data.type}<br>`;
            content += `<strong>Línea:</strong> ${d.data.line || '?'}<br>`;
            content += `<strong>Columna:</strong> ${d.data.column || '?'}<br>`;

            for (const key in d.data) {
                if (!['type', 'line', 'column', 'children'].includes(key) && typeof d.data[key] !== 'object') {
                    content += `<strong>${key}:</strong> ${d.data[key]}<br>`;
                }
            }

            tooltip.html(content)
                .style("left", (event.pageX + 10) + "px")
                .style("top", (event.pageY - 10) + "px")
                .style("opacity", 1);
        }

        function hideTooltip() {
            d3.select("#tooltip").style("opacity", 0);
        }

        function zoomIn() { d3.select("svg").transition().call(zoom.scaleBy, 1.3); }
        function zoomOut() { d3.select("svg").transition().call(zoom.scaleBy, 0.7); }
        function resetZoom() { d3.select("svg").transition().call(zoom.transform, d3.zoomIdentity); }
        function reloadData() { loadData(); }

        window.addEventListener('resize', () => {
            // Redibujar si es necesario, aunque el zoom ayuda
        });

        init();
    </script>
</body>

</html>
